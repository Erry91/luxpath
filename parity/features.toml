notes = "`luxpath inspect-ifc`, text or JSON; IFC2x3 and IFC4 STEP. Checked on 9 public models (docs/research.md §7). Missing: geometry (positions, space outlines), per-storey breakdown, IfcZone/IfcSpatialZone, ifcZIP and ifcXML, IFC4.3-specific entities."

